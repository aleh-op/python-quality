description: >-
  Full pre-push gate — uv.lock drift, ruff format and check, pyrefly, pytest,
  config drift, supply-chain posture, pip-audit, ai-lint over tracked files,
  soft caps. First failure stops the run.

props:
  dir:
    type: string
    default: "."
    description: >-
      Directory holding the pyproject.toml to gate, relative to where provision
      is invoked. A repo whose projects are not one uv workspace passes each in
      turn; making them a workspace is that repo's business, not the gate's.
  cap_loc:
    type: string
    default: "500"
    description: God-file soft cap, in code lines (informational).
  audit:
    type: string
    default: "1"
    description: >-
      "0" skips pip-audit, the gate's one network step. Offline it already
      degrades to a note; this is for a repo that must never reach out.
  ruff_args:
    type: string
    default: ""
    description: Extra flags appended to `ruff check`.
  pyrefly_args:
    type: string
    default: ""
    description: Extra flags appended to `pyrefly check`.
  pytest_args:
    type: string
    default: ""
    description: Extra flags appended to `pytest` (e.g. "-m 'not slow'").

steps:
  # The full gate runs the consumer's whole test suite. Ten minutes is
  # provision's default and a cold machine will exceed it. The timeout lives
  # here rather than at a call site: a `use` step propagates tags to its
  # children and nothing else, so a consumer cannot reach in to set it.
  - name: full gate
    # `cd` first, then the assignments. A prefix on `cd` would not reach the
    # script: `cd` is a regular builtin, so `VAR=x cd d` does not export VAR
    # past the command, and the gate would silently run with its own defaults
    # instead of the consumer's.
    shell: >-
      cd "{{ props.dir }}" &&
      CAP_LOC="{{ props.cap_loc }}" PQ_AUDIT="{{ props.audit }}"
      RUFF_ARGS="{{ props.ruff_args }}" PYREFLY_ARGS="{{ props.pyrefly_args }}"
      PYTEST_ARGS="{{ props.pytest_args }}"
      bash "{{ component_dir }}/scripts/gate.sh" full
    changed_when: false
    timeout: 30m
